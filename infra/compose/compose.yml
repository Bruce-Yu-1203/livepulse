name: livepulse

services:
  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-at-least-32-random-bytes}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      DATABASE_URL: postgresql://livepulse:livepulse_dev_password@postgres:5432/livepulse?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      NODE_ENV: development
      PORT: 3001
      PROHIBITED_WORDS: ${PROHIBITED_WORDS:-scam-offer,spam-link}
      REDIS_KEY_PREFIX: livepulse
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '3001:3001'

  migrate:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: api
    command:
      [
        ./packages/db/node_modules/.bin/prisma,
        migrate,
        deploy,
        --config,
        packages/db/prisma7.config.ts,
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://livepulse:livepulse_dev_password@postgres:5432/livepulse?schema=public

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: livepulse
      POSTGRES_PASSWORD: livepulse_dev_password
      POSTGRES_USER: livepulse
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U livepulse -d livepulse']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '5432:5432'
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.2-alpine3.23
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '6379:6379'

  seed:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: api
    command: [node, packages/db/prisma/seed.mjs]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://livepulse:livepulse_dev_password@postgres:5432/livepulse?schema=public
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    profiles: [tools]

  web:
    build:
      args:
        API_ORIGIN: http://api:3001
        NEXT_PUBLIC_SOCKET_IO_URL: ${NEXT_PUBLIC_SOCKET_IO_URL:-http://localhost:3001}
      context: ../..
      dockerfile: infra/compose/Dockerfile
      target: web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_ORIGIN: http://api:3001
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - '3000:3000'

volumes:
  postgres-data:
