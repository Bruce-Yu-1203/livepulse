name: livepulse

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: livepulse
      POSTGRES_PASSWORD: livepulse_dev_password
      POSTGRES_USER: livepulse
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U livepulse -d livepulse']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '5432:5432'
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
