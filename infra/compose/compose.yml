name: livepulse

services:
  mongodb:
    image: mongo:8.0.32-noble
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db

  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: livepulse
      POSTGRES_PASSWORD: livepulse_dev_password
      POSTGRES_USER: livepulse
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U livepulse -d livepulse']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '5432:5432'
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.2-alpine3.23
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    ports:
      - '6379:6379'

volumes:
  mongodb-data:
  postgres-data:
