name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: livepulse_test
          POSTGRES_USER: livepulse
          POSTGRES_PASSWORD: livepulse_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livepulse -d livepulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.2-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: livepulse-ci-test-secret-at-least-32-bytes
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://livepulse:livepulse_test_password@localhost:5432/livepulse_test?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_KEY_PREFIX: livepulse-ci
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @livepulse/contracts build
      - run: pnpm --filter @livepulse/db build
      - run: pnpm --filter @livepulse/db exec prisma migrate deploy --config prisma7.config.ts
      - run: pnpm test:db

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-debug-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
